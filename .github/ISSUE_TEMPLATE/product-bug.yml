name: "🐛 Product Bug"
description: Report a problem with the Contextual CLI, MCP server, or web dashboard (not documentation)
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A clear description of the bug
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Contextual version
      description: Output of `contextual --version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Output of `contextual doctor` if applicable. Redact anything sensitive (paths, tokens, license keys).
      render: shell
    validations:
      required: false
