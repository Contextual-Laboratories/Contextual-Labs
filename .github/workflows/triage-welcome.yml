name: Triage welcome

# Zero third-party Actions, deliberately — actions/github-script is a
# GitHub-maintained official Action (actions/ org), same trust tier as
# actions/checkout. Posts once per new issue, acknowledging receipt and
# setting the response-time expectation honestly (see SUPPORT.md).

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                "Thanks for opening this — you're on the list. This is a solo-maintained",
                "project, so response times aren't instant, but nothing here goes",
                "ignored: real humans (well, one) read every issue.",
                "",
                "**Typical first response: 1–3 business days.** If it's been longer than",
                "that, a bump comment is always fair game.",
              ].join("\n"),
            });
