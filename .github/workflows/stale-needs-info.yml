name: Stale needs-info issues

# actions/stale is a GitHub-maintained official Action (actions/ org), same
# trust tier as actions/checkout — not a third-party marketplace Action.
#
# Scoped deliberately narrow: only-labels restricts this to
# "status: needs-info" issues (waiting on the reporter), and PR staleness is
# disabled outright. This must never touch an issue waiting on maintainer
# action — a blanket stale-bot is the wrong pattern for a support channel.

on:
  schedule:
    - cron: "0 0 * * *" # daily at midnight UTC
  workflow_dispatch:

permissions:
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639 # v9
        with:
          days-before-stale: 14
          days-before-close: 7
          only-labels: "status: needs-info"
          exempt-issue-labels: "status: needs-triage,status: investigating"
          stale-issue-label: "stale"
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-message: >
            Circling back — it's been 14 days since we asked for more info
            and haven't heard back. Still hitting this? Reply with the
            details above and we'll pick it back up. Otherwise this'll
            close in 7 days — not a judgment on the bug, just keeping the
            tracker honest.
          close-issue-message: >
            Closing this out for now due to no response. If it's still
            happening, feel free to open a fresh issue with the requested
            info — happy to take another look.
