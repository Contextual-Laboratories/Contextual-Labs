name: Dependabot auto-merge

# Zero third-party Actions, deliberately — same convention as the rest of
# this repo's workflows. Plain `gh pr merge --auto`, gated to PRs actually
# opened by Dependabot, rather than a marketplace metadata action.
#
# `--auto` merges once the PR is mergeable and any required checks (if
# configured later) pass — low blast radius here (github-actions ecosystem
# only, a docs/content repo, not a codebase-access daemon), same reasoning
# behind the lax cooldown policy in dependabot.yml.

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for Dependabot PR
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
