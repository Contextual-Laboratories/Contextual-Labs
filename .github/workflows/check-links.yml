name: Check Links

# Zero third-party Actions, deliberately — same convention as every
# workflow in this repo. Broken-link checking is a plain curl loop over
# links extracted from markdown, not a third-party marketplace Action.

on:
  schedule:
    - cron: "0 0 * * 1" # weekly, Monday midnight UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check external links in markdown
        run: |
          set -uo pipefail
          fail=0

          urls=$(grep -rhoE '\]\((https?://[^) ]+)\)' --include='*.md' . \
            | sed -E 's/^\]\(//; s/\)$//' \
            | sort -u)

          for url in $urls; do
            case "$url" in
              *localhost*|*example.com*|*127.0.0.1*)
                continue
                ;;
              *://contextuallabs.dev*|*://www.contextuallabs.dev*)
                # Confirmed 2026-09-06: contextuallabs.dev is up and returns
                # 200 from ordinary clients, but this runner's IP range gets
                # a 403 from Cloudflare/WAF on every run (verified live, not
                # a UA issue — same curl call succeeds from a non-Actions
                # network). That's a Cloudflare-zone config on the site's
                # infra, out of this repo's reach — skip rather than let a
                # permanent false positive mask real broken-link signal.
                continue
                ;;
            esac

            code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 20 --retry 2 --retry-delay 3 "$url" || echo "000")
            case "$code" in
              200|206|301|302|303|307|308)
                ;;
              *)
                echo "::error::Broken link ($code): $url"
                fail=1
                ;;
            esac
          done

          exit $fail
