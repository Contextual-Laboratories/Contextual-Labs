name: Notify Contextual-Web of docs changes

# Zero third-party Actions, deliberately — matches the pattern in
# Contextual's sync-docs-to-labs.yml (see Teams/DOCKET.md 2026-07-11).
# Fires a repository_dispatch at Contextual-Web so its build pipeline can
# pull fresh docs content. Plain curl against GitHub's REST API, nothing
# to trust beyond GitHub itself.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fire repository_dispatch to Contextual-Web
        run: |
          set -euo pipefail
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.WEB_DISPATCH_PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Contextual-Laboratory/Contextual-Web/dispatches \
            -d '{"event_type":"docs-updated","client_payload":{"sha":"'"${GITHUB_SHA}"'","ref":"'"${GITHUB_REF}"'"}}')
          if [ "$status" -ne 204 ]; then
            echo "Dispatch failed with HTTP $status"
            cat /tmp/response.json
            exit 1
          fi
          echo "Dispatched docs-updated to Contextual-Web ($GITHUB_SHA)"
