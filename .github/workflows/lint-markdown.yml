name: Lint Markdown

# Zero third-party Actions, deliberately — same convention as
# dispatch-to-web.yml. markdownlint-cli2 is installed via npm at run time
# (official actions/checkout + actions/setup-node only), not invoked
# through a third-party marketplace Action.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Run markdownlint-cli2
        run: npx --yes markdownlint-cli2 "**/*.md"
