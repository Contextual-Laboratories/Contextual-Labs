body:
  - type: markdown
    attributes:
      value: |
        A quick search of existing Q&A discussions might already have your answer.
  - type: textarea
    id: question
    attributes:
      label: What are you trying to do, and what's happening instead?
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you already tried?
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Contextual version (if relevant)
      description: Output of `contextual --version`
    validations:
      required: false
